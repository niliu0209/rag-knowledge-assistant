[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "本地私有知识库 RAG 问答助手（阶段 0 MVP）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "streamlit>=1.38",
    "chromadb>=0.6",
    # LlamaIndex 数据层（选型定案：解析/切片原语；S2 起引入）
    "llama-index-core>=0.14",
    "llama-index-readers-file>=0.6",
    # DocxReader 的运行时依赖（readers-file 默认不携带）
    "docx2txt>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # 测试合成 fixture（docx/PDF/图片 PDF，本地隔离可复现）
    "python-docx>=1.1",
    "reportlab>=4.2",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["app*", "ui*", "rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
